# 机场订阅
proxy-providers:
  gg:
    url: "https://etwbgx.doggygosubs.com:8443/api/v1/client/49b998543a8dac7e324f052c0112139b"
    type: http
    interval: 86400
    proxy: DIRECT
    path: ./providers/gg.yaml
# 全局配置
mode: rule
mixed-port: 7890
redir-port: 7891
tproxy-port: 7892
allow-lan: true
bind-address: "*"
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: info
find-process-mode: "off"
client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true
geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  metadb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
  asn: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"
hosts:
  doh.dohcore.com: 108.62.161.127
  doh.cloudflare-lab.com: 108.62.161.127
external-controller: 127.0.0.1:9090
external-ui: ui/zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
system-proxy:
  enable: true
# 入站
tun:
  enable: false
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  inet4-route-exclude-address:
    - 192.168.0.0/16
# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  listen: 127.0.0.1:5335
  ipv6: true
  # respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "GEOSITE:private"
    - "GEOSITE:cn"
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - https://cloudflare-dns.com/dns-query
  nameserver-policy:
    +.quandao.com:
      - https://doh.dohcore.com:2096/dns-query#skip-cert-verify=true
      - https://doh.cloudflare-lab.com:2096/dns-query#skip-cert-verify=true
    +.jiandaoyun.com:
      - https://doh.dohcore.com:2096/dns-query#skip-cert-verify=true
      - https://doh.cloudflare-lab.com:2096/dns-query#skip-cert-verify=true
  # nameserver:
  #   - 223.5.5.5
  #   - 119.29.29.29
  # proxy-server-nameserver:
  #   - 223.5.5.5
  #   - 119.29.29.29
# 出站策略
pr: &pr {type: select, proxies: [默认代理, 全部节点, "\U0001F1E8\U0001F1F3 台湾自动", "\U0001F1ED\U0001F1F0 香港自动", "\U0001F1EF\U0001F1F5 日本自动", "\U0001F1F8\U0001F1EC 新加坡自动", "\U0001F1F0\U0001F1F7 韩国自动", "\U0001F1E6\U0001F1FA 澳洲自动", DIRECT]}
proxy-groups:
  - {name: 默认代理, type: select, proxies: [全部节点, "\U0001F1E8\U0001F1F3 台湾自动", "\U0001F1ED\U0001F1F0 香港自动", "\U0001F1EF\U0001F1F5 日本自动", "\U0001F1F8\U0001F1EC 新加坡自动", "\U0001F1F0\U0001F1F7 韩国自动", "\U0001F1E6\U0001F1FA 澳洲自动", DIRECT], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available_1.png"}
  - {name: "\U0001F1E8\U0001F1F3 台湾自动", type: url-test, url: "https://www.gstatic.com/generate_204", timeout: 5000, tolerance: 20, interval: 600, max-failed-times: 3, expected-status: 204, filter: "(?i)TW|台湾", use: [gg]}
  - {name: "\U0001F1ED\U0001F1F0 香港自动", type: url-test, url: "https://www.gstatic.com/generate_204", timeout: 5000, tolerance: 20, interval: 600, max-failed-times: 3, expected-status: 204, filter: "(?i)HK|香港", use: [gg]}
  - {name: "\U0001F1EF\U0001F1F5 日本自动", type: url-test, url: "https://www.gstatic.com/generate_204", timeout: 5000, tolerance: 20, interval: 600, max-failed-times: 3, expected-status: 204, filter: "(?i)JP|Japan|日本", use: [gg]}
  - {name: "\U0001F1F8\U0001F1EC 新加坡自动", type: url-test, url: "https://www.gstatic.com/generate_204", timeout: 5000, tolerance: 20, interval: 600, max-failed-times: 3, expected-status: 204, filter: "(?i)SG|Singapore|新加坡", use: [gg]}
  - {name: "\U0001F1F0\U0001F1F7 韩国自动", type: url-test, url: "https://www.gstatic.com/generate_204", timeout: 5000, tolerance: 20, interval: 600, max-failed-times: 3, expected-status: 204, filter: "(?i)KR|Korea|韩国", use: [gg]}
  - {name: "\U0001F1E6\U0001F1FA 澳洲自动", type: url-test, url: "https://www.gstatic.com/generate_204", timeout: 5000, tolerance: 20, interval: 600, max-failed-times: 3, expected-status: 204, filter: "(?i)AU|Australia|澳洲|澳大利亚", use: [gg]}
  - {name: YouTube, !!merge <<: *pr, icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png"}
  - {name: ChatGPT, !!merge <<: *pr, icon: "https://fastly.jsdelivr.net/gh/shindgewongxj/WHATSINStash@master/icon/openai.png"}
  - {name: Telegram, !!merge <<: *pr, icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png"}
  - {name: GitHub, !!merge <<: *pr, icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/GitHub.png"}
  - {name: Google, !!merge <<: *pr, icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google_Search.png"}
  - {name: 漏网之鱼, !!merge <<: *pr, icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Final.png"}
  - {name: 全部节点, type: select, use: [gg], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png"}
# 规则匹配
rules:
  - IP-CIDR,10.100.100.0/24,DIRECT,no-resolve
  - DOMAIN-SUFFIX,minieye.tech,DIRECT
  - DOMAIN-SUFFIX,minieye.9966.org,DIRECT
  - DOMAIN-SUFFIX,th.bing.com, 默认代理
  - GEOSITE,private, DIRECT
  - GEOSITE,category-scholar-!cn, 默认代理
  - GEOSITE,steam@cn, DIRECT
  - GEOSITE,category-games@cn, DIRECT
  - GEOSITE,category-ai-!cn, ChatGPT
  - GEOSITE,github, GitHub
  - GEOSITE,youtube, YouTube
  - GEOSITE,google, Google
  - GEOSITE,telegram, Telegram
  - GEOSITE,microsoft@cn, DIRECT
  - GEOSITE,gfw, 默认代理
  - GEOSITE,geolocation-!cn, 默认代理
  - GEOSITE,cn, DIRECT
  - GEOIP,private, DIRECT,no-resolve
  - GEOIP,google, Google,no-resolve
