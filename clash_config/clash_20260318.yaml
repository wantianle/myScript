# 机场订阅
proxy-providers:
  zsh:
    url: "https://zhs.futbol/link/whYbmVLDYRUzadUW?is_ss=5&dns=1&tj=1&disney&y2b&ai&nf"
    type: http
    interval: 86400
    proxy: DIRECT
    path: ./providers/zhs.tw.yaml
  gg:
    url: "https://cXTQayDn.doggygosubs.com:8443/api/v1/client/49b998543a8dac7e324f052c0112139b"
    type: http
    interval: 86400
    proxy: DIRECT
    path: ./providers/gg.yaml
# 全局配置
mode: rule
mixed-port: 7890
redir-port: 7891
tproxy-port: 7892
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
find-process-mode: 'off'
client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true
geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  metadb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
  asn: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"
external-controller: 127.0.0.1:9090
external-ui: ui/zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
system-proxy:
  enable: true
# 入站
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  inet4-route-exclude-address:
    - 192.168.0.0/16
# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:53
  ipv6: false
  # respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "GEOSITE:private"
    - "GEOSITE:cn"
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
# 出站策略
pr: &pr {type: select, proxies: [默认代理, 全部节点, "\U0001F1E8\U0001F1F3 台湾自动", "\U0001F1ED\U0001F1F0 香港自动", DIRECT]}
proxy-groups:
  - {name: 默认代理, type: select, proxies: ["\U0001F1E8\U0001F1F3 台湾自动", "\U0001F1ED\U0001F1F0 香港自动", DIRECT], icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available_1.png'}
  - {name: "\U0001F1E8\U0001F1F3 台湾自动", type: url-test, url: 'https://www.gstatic.com/generate_204', timeout: 5000, tolerance: 20, interval: 600, max-failed-times: 3, expected-status: 204, filter: "(?i)TW|台湾", use: [zsh, gg]}
  - {name: "\U0001F1ED\U0001F1F0 香港自动", type: url-test, url: 'https://www.gstatic.com/generate_204', timeout: 5000, tolerance: 20, interval: 600, max-failed-times: 3, expected-status: 204, filter: "(?i)HK|香港", use: [zsh, gg]}
  - {name: YouTube, !!merge <<: *pr, icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png'}
  - {name: ChatGPT, !!merge <<: *pr, icon: 'https://fastly.jsdelivr.net/gh/shindgewongxj/WHATSINStash@master/icon/openai.png'}
  - {name: Telegram, !!merge <<: *pr, icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png'}
  - {name: GitHub, !!merge <<: *pr, icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/GitHub.png'}
  - {name: Google, !!merge <<: *pr, icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google_Search.png'}
  - {name: 漏网之鱼, !!merge <<: *pr, icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Final.png'}
  - {name: 全部节点, type: select, use: [zsh, gg], icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png'}
# 规则匹配
rules:
  - DOMAIN-SUFFIX,th.bing.com, 默认代理
  - GEOSITE,private, DIRECT
  - GEOSITE,category-scholar-!cn, 默认代理
  - GEOSITE,steam@cn, DIRECT
  - GEOSITE,category-games@cn, DIRECT
  - GEOSITE,category-ai-!cn, ChatGPT
  - GEOSITE,github, GitHub
  - GEOSITE,youtube, YouTube
  - GEOSITE,google, Google
  - GEOSITE,telegram, Telegram
  - GEOSITE,microsoft@cn, DIRECT
  - GEOSITE,gfw, 默认代理
  - GEOSITE,geolocation-!cn, 默认代理
  - GEOSITE,cn, DIRECT
  - GEOIP,private, DIRECT,no-resolve
  - GEOIP,google, Google,no-resolve
  - GEOIP,telegram, Telegram,no-resolve
  - GEOIP,cn, DIRECT
  - MATCH, 漏网之鱼
