# sdwan tunnel configuration
# Lines starting with # are ignored

# Server address (empty = interactive selection at startup)
server=minieye.9966.org

# Authentication
username=your_username
password=your_password

# Connection settings
port=10010
mtu=1436
encrypt=0

# TUN interface name (default: iwan1)
tunname=iwan1

# Route network (default: 192.168.0.0/16) 
routenet=192.168.0.0/16

# Pipe settings (usually 0)
pipeid=0
pipeidx=0
